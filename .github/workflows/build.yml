name: Build

on:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      installers: ${{ steps.installers.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: frontend-checks
        with:
          path: |
            target/ci-checks/frontend
            frame/dist
          key: frontend-checks-v1-${{ hashFiles('package.json', 'pnpm-lock.yaml', '.node-version', 'vite.config.ts', 'knip.json', 'frame/**', 'scripts/ci/**') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rust-checks
        with:
          path: target/ci-checks/rust
          key: rust-checks-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**', 'desktop/**', 'xtask/**', '.cargo/**', 'vendor/**') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: test-checks
        with:
          path: target/ci-checks/tests
          key: test-checks-v1-${{ hashFiles('package.json', 'pnpm-lock.yaml', '.node-version', 'frame/**', 'crates/**', 'scripts/ci/**') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.frontend-checks.outputs.cache-hit != 'true' || steps.test-checks.outputs.cache-hit != 'true'
        with:
          node-version-file: .node-version
      - name: Install the pinned pnpm package
        if: steps.frontend-checks.outputs.cache-hit != 'true' || steps.test-checks.outputs.cache-hit != 'true'
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - name: Locate the pnpm store
        id: pnpm-store
        if: steps.frontend-checks.outputs.cache-hit != 'true' || steps.test-checks.outputs.cache-hit != 'true'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.frontend-checks.outputs.cache-hit != 'true' || steps.test-checks.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.node-version') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
        if: steps.frontend-checks.outputs.cache-hit != 'true' || steps.test-checks.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.rust-checks.outputs.cache-hit != 'true'
        with:
          shared-key: desktop-aarch64-apple-darwin
          cache-on-failure: true
          save-if: startsWith(github.ref, 'refs/tags/v')
      - run: pnpm --dir frame build
        if: steps.frontend-checks.outputs.cache-hit != 'true'
      - run: ruby scripts/ci/check_action_pins.rb
      - run: pnpm exec vp -C frame check --deny-warnings
        if: steps.frontend-checks.outputs.cache-hit != 'true'
      - run: pnpm exec vp fmt --check vite.config.ts package.json frame/package.json
        if: steps.frontend-checks.outputs.cache-hit != 'true'
      - run: pnpm exec knip --include dependencies --no-progress
        if: steps.frontend-checks.outputs.cache-hit != 'true'
      - name: Mark frontend checks as passed
        if: steps.frontend-checks.outputs.cache-hit != 'true'
        run: mkdir -p target/ci-checks/frontend && printf '%s\\n' "passed" > target/ci-checks/frontend/passed
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.frontend-checks.outputs.cache-hit != 'true'
        with:
          path: |
            target/ci-checks/frontend
            frame/dist
          key: ${{ steps.frontend-checks.outputs.cache-primary-key }}
      - run: cargo fmt --all -- --check
        if: steps.rust-checks.outputs.cache-hit != 'true'
      - run: cargo clippy --workspace --release --locked -- -D warnings
        if: steps.rust-checks.outputs.cache-hit != 'true'
      - name: Mark Rust checks as passed
        if: steps.rust-checks.outputs.cache-hit != 'true'
        run: mkdir -p target/ci-checks/rust && printf '%s\\n' "passed" > target/ci-checks/rust/passed
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.rust-checks.outputs.cache-hit != 'true'
        with:
          path: target/ci-checks/rust
          key: ${{ steps.rust-checks.outputs.cache-primary-key }}
      - run: pnpm --dir frame test:ipc
        if: steps.test-checks.outputs.cache-hit != 'true'
      - run: pnpm --dir frame test:deck
        if: steps.test-checks.outputs.cache-hit != 'true'
      - name: Extension transport tests
        if: steps.test-checks.outputs.cache-hit != 'true'
        run: node --test crates/zephium-webext/src/storage/bridge.test.mjs crates/zephium-webext/src/windows/*.test.mjs crates/zephium-webext-macos/tests/compat.test.mjs crates/zephium-engine/src/host/deck/*.test.mjs
      - name: Mark test checks as passed
        if: steps.test-checks.outputs.cache-hit != 'true'
        run: mkdir -p target/ci-checks/tests && printf '%s\\n' "passed" > target/ci-checks/tests/passed
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.test-checks.outputs.cache-hit != 'true'
        with:
          path: target/ci-checks/tests
          key: ${{ steps.test-checks.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frame-dist
          path: frame/dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Check workflow syntax
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f"
          ACTIONLINT_ARCHIVE: "actionlint_1.7.12_darwin_arm64.tar.gz"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ARCHIVE}" --output "${archive}"
          test "$(shasum -a 256 "${archive}" | cut -d ' ' -f1)" = "${ACTIONLINT_SHA256}"
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color
      - name: Check whether the release owns the installer build
        id: installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] || [[ "$(gh run list --workflow release.yml --commit "${GITHUB_SHA}" --limit 1 --json databaseId --jq length)" == 0 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
  installers:
    name: ${{ matrix.platform }}
    needs: checks
    if: needs.checks.outputs.installers == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    concurrency:
      group: installers-${{ github.sha }}-${{ matrix.platform }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: app,dmg
            installer: dmg
            extension: dmg
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
            installer: nsis
            extension: exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frame-dist
          path: frame/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the pinned pnpm package
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.node-version') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up the pinned Rust toolchain
        run: rustup show active-toolchain && rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: desktop-${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
      - run: pnpm install --frozen-lockfile
      - name: Write third-party notices
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/release/third_party_notices.py target/THIRD_PARTY_NOTICES.txt
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: >-
          pnpm --dir desktop exec tauri build --ci
          --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
          --config '{"build":{"beforeBuildCommand":"echo frontend already built"},"bundle":{"createUpdaterArtifacts":${{ startsWith(github.ref, 'refs/tags/v') }},"macOS":{"signingIdentity":"-"},"resources":{"../target/THIRD_PARTY_NOTICES.txt":"licenses/THIRD_PARTY_NOTICES.txt"}}}' -- --locked
      - name: Collect the installer
        run: |
          mkdir -p target/installers
          cp target/${{ matrix.target }}/release/bundle/${{ matrix.installer }}/*.${{ matrix.extension }} target/installers/
      - name: Prepare signed update artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/release/updater.py prepare
          --target ${{ matrix.target }} --tag "${{ github.ref_name }}" --repository "${{ github.repository }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: target/installers/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
