name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the pinned pnpm package
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.node-version') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - run: ruby scripts/ci/check_action_pins.rb
      - run: pnpm --dir frame typecheck
      - run: pnpm --dir frame test:ipc
      - name: Extension transport tests
        run: node --test crates/zephium-webext/src/storage/bridge.test.mjs crates/zephium-webext/src/windows/*.test.mjs crates/zephium-webext-macos/tests/compat.test.mjs
      - name: Check workflow syntax
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" --output "${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  installers:
    name: ${{ matrix.platform }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            extension: dmg
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the pinned pnpm package
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.node-version') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up the pinned Rust toolchain
        run: rustup show active-toolchain && rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: desktop-${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
      - run: pnpm install --frozen-lockfile
      - name: Rust tests
        if: matrix.platform == 'macos-arm64'
        run: cargo test --workspace --locked
      - name: Write third-party notices
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/release/third_party_notices.py target/THIRD_PARTY_NOTICES.txt
      - name: Build the installer
        run: >-
          pnpm --dir desktop exec tauri build --ci
          --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
          --config '{"bundle":{"macOS":{"signingIdentity":"-"},"resources":{"../target/THIRD_PARTY_NOTICES.txt":"licenses/THIRD_PARTY_NOTICES.txt"}}}' -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
