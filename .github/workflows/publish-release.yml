name: Publish Release

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate signed update feed and write checksums
        run: python3 scripts/release/updater.py manifest --directory dist --tag "${{ github.event.workflow_run.head_branch }}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)" = "${CANDIDATE}"
          gh release create "${TAG}" dist/* --verify-tag --prerelease="$([[ "${TAG}" == *-* ]] && echo true || echo false)" \
            --title "BDeck ${TAG}" \
            --notes 'macOS: Apple Silicon DMG. Windows: x64 installer. macOS is ad-hoc signed without notarization; Windows has no publisher signature.'
