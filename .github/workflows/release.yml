name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match the tag to the application version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("desktop/Cargo.toml").read_text())["package"]["version"]
          if os.environ["TAG"] != f"v{version}":
              raise SystemExit(f"Tag must be v{version}")
          PYTHON

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Check the complete asset set and write checksums
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          root = Path("dist")
          files = sorted(root.iterdir())
          if len(files) != 3 or sum(file.suffix == ".dmg" for file in files) != 2 or sum(file.suffix == ".exe" for file in files) != 1:
              raise SystemExit("Expected two macOS DMGs and one Windows installer")
          checksums = [f"{hashlib.file_digest(file.open('rb'), 'sha256').hexdigest()}  {file.name}" for file in files]
          (root / "SHA256SUMS").write_text("\n".join(checksums) + "\n")
          PYTHON
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)" = "${CANDIDATE}"
          if gh release view "${TAG}" --json isDraft > release.json; then
            jq --exit-status '.isDraft == true' release.json > /dev/null
          else
            gh release create "${TAG}" --verify-tag --draft --prerelease="$([[ "${TAG}" == *-* ]] && echo true || echo false)" \
              --title "BDeck ${TAG}" \
              --notes 'macOS: Apple Silicon / Intel DMG. Windows: x64 installer. macOS is ad-hoc signed without notarization; Windows has no publisher signature.'
          fi
          gh release upload "${TAG}" dist/* --clobber
