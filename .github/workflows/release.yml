name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match the tag to the application version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("desktop/Cargo.toml").read_text())["package"]["version"]
          if os.environ["TAG"] != f"v{version}":
              raise SystemExit(f"Tag must be v{version}")
          PYTHON

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
