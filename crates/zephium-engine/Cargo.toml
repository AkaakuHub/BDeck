[package]
name = "zephium-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zephium-core.workspace = true
wry = { workspace = true, features = ["devtools"] }
dirs = "6"
serde_json.workspace = true
base64 = "0.22"
sha2 = "=0.10.9"
url.workspace = true
zeroize = "=1.9.1"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
wry = { workspace = true, features = ["windows-cleanup-qualification"] }
windows = { version = "0.61", features = ["Win32_Graphics_DirectComposition", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common"] }
base64 = "0.22"
flate2 = "=1.1.10"

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.22"
zephium-webext = { path = "../zephium-webext", version = "=0.1.0" }
raw-window-handle.workspace = true
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Foundation_Collections",
    "Foundation_Numerics",
    "System",
    "UI_Composition_Desktop",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT_Composition",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
windows-numerics = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3.1", default-features = false, features = ["block2", "std"] }
libc = "0.2"
objc2 = "0.6"
objc2-authentication-services = { version = "=0.3.2", default-features = false, features = [
    "ASAuthorizationWebBrowserPublicKeyCredentialManager",
    "block2",
] }
objc2-app-kit = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = "0.3"
objc2-core-location = { version = "0.3", default-features = false, features = [
    "std",
    "CLError",
    "CLErrorDomain",
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
] }
objc2-foundation = "0.3"
objc2-security = { version = "0.3", default-features = false, features = [
    "CSCommon",
    "SecRequirement",
    "SecStaticCode",
    "SecTask",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "block2",
    "objc2-app-kit",
    "WKBackForwardList",
    "WKBackForwardListItem",
    "WKDownload",
    "WKDownloadDelegate",
    "WKContentWorld",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKError",
    "WKNavigationAction",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKSecurityOrigin",
    "WKUIDelegate",
    "WKWindowFeatures",
    "WKPreferences",
    "WKFrameInfo",
    "WKScriptMessage",
    "WKScriptMessageHandlerWithReply",
    "WKSnapshotConfiguration",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataRecord",
    "WKWebsiteDataStore",
] }
objc2-quartz-core = "0.3"
raw-window-handle.workspace = true
zephium-webext = { path = "../zephium-webext", version = "=0.1.0" }
zephium-webext-macos = { path = "../zephium-webext-macos", version = "=0.1.0" }
